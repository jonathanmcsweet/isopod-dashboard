name: Release

# Publish the extension as an OCI image to GitHub Container Registry so end users
# can install it in Podman Desktop by reference. Triggered by a version tag
# (v0.8.3) or by hand. The image is pushed to ghcr.io/<owner>/<repo>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and push, e.g. v0.8.3'
        required: true

permissions:
  contents: read
  packages: write # push to GHCR with the built-in GITHUB_TOKEN

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag ($version) does not match package.json version ($pkg) — bump one to match"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install, verify, build
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${{ steps.v.outputs.version }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.v.outputs.version }}"
          docker push "$IMAGE:latest"

      - name: Summary
        run: |
          {
            echo "### Published \`$IMAGE:${{ steps.v.outputs.version }}\`"
            echo ""
            echo "Install in Podman Desktop → Extensions → Install custom extension from OCI image:"
            echo ""
            echo "    $IMAGE:${{ steps.v.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
